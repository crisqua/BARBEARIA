<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barberaria — Painel da Barbearia</title>
    <style>
      input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }
      input[type="color"]::-moz-color-swatch {
        border: none;
        border-radius: 6px;
      }

      /* Barra de rolagem padrão do navegador (cinza) destoava do tema escuro/dourado — usada na faixa de dias da Agenda. */
      .themed-scroll {
        scrollbar-width: thin;
        scrollbar-color: #C9A84C88 #1F1F1F;
      }
      .themed-scroll::-webkit-scrollbar {
        height: 6px;
      }
      .themed-scroll::-webkit-scrollbar-track {
        background: #1F1F1F;
        border-radius: 10px;
      }
      .themed-scroll::-webkit-scrollbar-thumb {
        background: #C9A84C88;
        border-radius: 10px;
      }
      .themed-scroll::-webkit-scrollbar-thumb:hover {
        background: #C9A84C;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
